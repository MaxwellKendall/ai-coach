# FIT-56. Cognito user pools is the only auth mode, so every field requires a signed-in user.
# The caller's uid always comes from the token (ctx.identity.sub), never from arguments,
# so a member can only write items keyed by their own uid.
#
# Subscribers only receive the fields the publishing mutation selected, so clients must
# select every field of LiveSet / Progress / FeedItem when they publish.

type Profile {
  uid: ID!
  displayName: String
  units: String
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type GroupSummary {
  groupId: ID!
  name: String!
  role: String!
  inviteCode: String
  # Whether I share live workouts with this group (FIT-53).
  shareLive: Boolean
}

type Member {
  groupId: ID!
  uid: ID!
  displayName: String
  role: String!
  shareLive: Boolean!
  joinedAt: AWSDateTime!
}

type GroupGoal {
  groupId: ID!
  goalId: ID!
  metric: String!
  target: Float!
  deadline: AWSDate
  mode: String!
  createdBy: ID!
  createdAt: AWSDateTime!
}

type Progress {
  groupId: ID!
  uid: ID!
  goalId: ID!
  baseline: Float
  value: Float
  pct: Float
  onPace: Boolean
  updatedAt: AWSDateTime!
}

type LiveSet {
  groupId: ID!
  uid: ID!
  workout: String
  exercise: String
  setIndex: Int
  setCount: Int
  loadLb: Float
  reps: Int
  seconds: Int
  rpe: Float
  state: String!
  startedAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type FeedItem {
  groupId: ID!
  id: ID!
  uid: ID!
  kind: String!
  measurements: AWSJSON
  createdAt: AWSDateTime!
}

type Group {
  id: ID!
  name: String!
  createdBy: ID!
  inviteCode: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  members: [Member!]!
  goals: [GroupGoal!]!
  progress: [Progress!]!
  live: [LiveSet!]!
  "FIT-114: this week's planned days of members who share them."
  weeks: [WeekPlan!]!
  feed(limit: Int): [FeedItem!]!
}

"FIT-114: a member's planned days for a week: day and session name, never logs or weights."
type WeekPlan {
  uid: ID!
  weekOf: AWSDate!
  days: [PlannedDay!]!
  updatedAt: AWSDateTime!
}

type PlannedDay {
  day: AWSDate!
  title: String!
}

input PlannedDayInput {
  day: AWSDate!
  title: String!
}

"""
FIT-126: one synced piece of a user's data: a day's planned activity (plan#YYYY-MM-DD) or logs (log#YYYY-MM-DD), a goal
(goal#UUID) or the profile. body is the app's JSON as a string, kept byte for byte; null when deleted. updatedAt is when the
writer changed it (the newest wins); changedAt is when the server stored it (the pull cursor).
"""
type SyncUnit {
  key: String!
  updatedAt: AWSDateTime!
  deleted: Boolean!
  body: String
  changedAt: AWSDateTime!
}

input SyncUnitInput {
  key: String!
  updatedAt: AWSDateTime!
  deleted: Boolean!
  body: String
}

"FIT-126: what a push stored; rejected are the server's newer copies of units it kept. Subscribers learn only that uid changed."
type SyncPush {
  uid: ID!
  source: String
  changedAt: AWSDateTime!
  rejected: [SyncUnit!]!
}

"FIT-130: a coach or a client, as the other sees them."
type Person {
  uid: ID!
  name: String
  since: AWSDateTime!
}

type Comment {
  day: String!
  at: AWSDateTime!
  by: ID!
  byName: String
  text: String!
}

type ProgramOffer {
  id: ID!
  coachUid: ID!
  coachName: String
  note: String!
  start: String!
  weeks: Int!
  "The template week, as sent (AWSJSON)."
  days: AWSJSON!
  addPerWeek: Float!
  "sent, started or declined"
  status: String!
  createdAt: AWSDateTime!
  answeredAt: AWSDateTime
}

type ClientInvite {
  code: String!
  url: String!
}

type SyncPage {
  units: [SyncUnit!]!
  "Pass back as since for the next page or the next pull."
  cursor: String
  more: Boolean!
}

"FIT-144: the coach plan: whether it's on sale yet, and the account's subscription (status none without one)."
type CoachPlan {
  onSale: Boolean!
  status: String!
  interval: String
  renews: AWSDateTime
  cancelsAtEnd: Boolean!
}

type Query {
  "FIT-126: my units stored since the cursor (all of them without one), oldest first. FIT-130: or a client's (uid), for their linked coach."
  syncPull(since: String, uid: ID): SyncPage!
  "FIT-130: the coach's name on a client invite, or null when it's used up or expired."
  coachInvite(code: String!): String
  "FIT-130: who coaches me, and whom I coach."
  myCoaches: [Person!]!
  myClients: [Person!]!
  "FIT-132: replies on logged sessions: a day's thread, or all of them; mine, or a client's (uid) for their coach."
  comments(uid: ID, day: String): [Comment!]!
  "FIT-131: programs sent to me, or (uid) the ones I sent a client, newest first."
  programOffers(uid: ID): [ProgramOffer!]!
  "FIT-113: a shared item by its id, so the app can open a session someone shared."
  share(id: ID!): SharedItem
  me: Profile
  "FIT-122: until when the account has Pro from a redeemed gift, or null."
  giftedPro: AWSDateTime
  coachPlan: CoachPlan!
  myGroups: [GroupSummary!]!
  group(groupId: ID!): Group
}

type Mutation {
  "FIT-126: store my changed units (at most 25); a unit older than the server's copy is rejected. source names the writer."
  syncPush(units: [SyncUnitInput!]!, source: String, uid: ID): SyncPush
  "FIT-137: link the account a fresh sign-in made (its ID token) to mine: Apple or Google, then one account. Returns the provider linked."
  linkAccount(token: String!): String
  "FIT-144: a Stripe Checkout URL for the coach plan (interval month or year), or null while it isn't on sale."
  startCoachPlan(interval: String!): String
  "FIT-144: a Stripe customer portal URL for the coach's billing, or null without a plan."
  coachBillingPortal: String
  "FIT-130: a single-use link for someone to make me their coach (14 days)."
  createClientInvite: ClientInvite
  "FIT-130: make the invite's coach mine; returns the coach."
  acceptCoach(code: String!): Person
  "FIT-130: end a link, as the client (unlinkCoach) or the coach (removeClient)."
  unlinkCoach(uid: ID!): Boolean
  removeClient(uid: ID!): Boolean
  "FIT-132: reply on a logged session (day YYYY-MM-DD): my own, or a client's (uid) as their coach."
  postComment(uid: ID, day: String!, text: String!): Comment
  "FIT-131: send a client a program: days is a template week as JSON ([{weekday 0-6 from Sunday, slot, rows}]), repeated for weeks from start."
  sendProgram(uid: ID!, start: String!, weeks: Int!, note: String, days: AWSJSON!, addPerWeek: Float): ProgramOffer
  "FIT-131: the client starts (writes it into their plan from its start day) or declines a program. offsetMinutes: their time zone, east of UTC."
  answerProgram(id: ID!, start: Boolean!, offsetMinutes: Int): ProgramOffer
  "FIT-105: save a win, recap or program to share; returns its link."
  createShare(kind: String!, payload: AWSJSON!): Share
  "FIT-107: a short-lived URL to upload the share's card (PNG), for link previews."
  shareImageUpload(id: ID!): String
  "FIT-107: take a share down; its link then says it has expired."
  deleteShare(id: ID!): Boolean
  updateProfile(displayName: String, units: String): Profile
  "FIT-122: redeem a gift code on this account; returns until when it has Pro."
  redeemGift(code: String!): AWSDateTime
  createGroup(name: String!): GroupSummary
  joinGroup(inviteCode: String!): GroupSummary
  leaveGroup(groupId: ID!): Boolean
  # Creator only (FIT-59).
  removeMember(groupId: ID!, uid: ID!): Boolean
  # Creator only (FIT-58): revokes the invite code and returns its replacement.
  rotateInvite(groupId: ID!): String
  setShareLive(groupId: ID!, shareLive: Boolean!): Member
  addGroupGoal(groupId: ID!, metric: String!, target: Float!, deadline: AWSDate, mode: String!): GroupGoal
  "FIT-114: share my planned days this week (weekOf: its Sunday) with the group (opt-in), or stop."
  publishWeek(groupId: ID!, weekOf: AWSDate!, days: [PlannedDayInput!]!): WeekPlan
  clearWeek(groupId: ID!): Boolean
  publishProgress(groupId: ID!, goalId: ID!, baseline: Float, value: Float, pct: Float, onPace: Boolean): Progress
  publishLiveSet(
    groupId: ID!
    workout: String
    exercise: String!
    setIndex: Int!
    setCount: Int!
    loadLb: Float
    reps: Int
    seconds: Int
    rpe: Float
    state: String!
    startedAt: AWSDateTime!
  ): LiveSet
  endLiveSession(groupId: ID!): LiveSet
  postFeed(groupId: ID!, kind: String!, measurements: AWSJSON): FeedItem
  registerDevice(token: String!, platform: String!): Boolean
  deleteAccount: Boolean
  # FIT-102: one Messages API request to Claude, sent on by the aiProxy Lambda with the key. Signed-in users only.
  # FIT-123: entitlement is the app's Pro transaction as Apple signed it (a JWS); without it, a few requests for good.
  aiMessages(request: AWSJSON!, entitlement: String): AWSJSON
}

type Subscription {
  onLiveSet(groupId: ID!): LiveSet @aws_subscribe(mutations: ["publishLiveSet", "endLiveSession"])
  onProgress(groupId: ID!): Progress @aws_subscribe(mutations: ["publishProgress"])
  onFeed(groupId: ID!): FeedItem @aws_subscribe(mutations: ["postFeed"])
  "FIT-126: my data changed somewhere; pull. Only for my own uid."
  onSync(uid: ID!): SyncPush @aws_subscribe(mutations: ["syncPush"])
}

"FIT-105: a shared win, recap or program, at its link."
type Share {
  id: ID!
  url: String!
}

"FIT-113: what was shared, as saved, and who shared it."
type SharedItem {
  id: ID!
  kind: String!
  name: String
  payload: AWSJSON!
}
