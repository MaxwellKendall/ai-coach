name: AICoach
options:
  bundleIdPrefix: com.maxwellkendall
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AICoach:
    type: application
    platform: iOS
    sources: [App, Core, Features, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxwellkendall.aicoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  AICoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: AICoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICoach:
    build:
      targets:
        AICoach: all
        AICoachTests: [test]
    test:
      targets: [AICoachTests]
