name: AICoach
options:
  bundleIdPrefix: com.maxwellkendall
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  # FIT-52: Cognito hosted-UI sign-in and AppSync. Reason recorded on FIT-52 (CLAUDE.md §3).
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: 2.62.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AICoach:
    type: application
    platform: iOS
    sources: [App, Core, Features, Resources]
    dependencies:
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin
      - package: Amplify
        product: AWSAPIPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxwellkendall.aicoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hold the mic to log meals, sleep and weight by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your voice is turned into text on this iPhone to fill in your log.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        # The author's personal history is a dogfooding aid, never shipped.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: history.json goals.json
  AICoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: AICoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # FIT-48: the real on-device model, scored. Slow and nondeterministic, so not in the AICoach scheme's tests.
  AICoachEvals:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Evals]
    dependencies:
      - target: AICoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICoach:
    build:
      targets:
        AICoach: all
        AICoachTests: [test]
    test:
      targets: [AICoachTests]
  AICoachEvals:
    build:
      targets:
        AICoach: all
        AICoachEvals: [test]
    test:
      targets: [AICoachEvals]
