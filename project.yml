name: AICoach
options:
  bundleIdPrefix: com.maxwellkendall
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  # FIT-52: Cognito hosted-UI sign-in and AppSync. Reason recorded on FIT-52 (CLAUDE.md §3).
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: 2.62.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    # Signing team for device builds and App Store archives.
    DEVELOPMENT_TEAM: 7GZKY29XJH
    CODE_SIGN_STYLE: Automatic
targets:
  AICoach:
    type: application
    platform: iOS
    sources: [App, Core, Features, Resources]
    # FIT-53: push. Archives for TestFlight and the App Store are re-signed with the production APNs environment.
    entitlements:
      path: App/AICoach.entitlements
      properties:
        aps-environment: development
        # FIT-138: Apple's own Sign in with Apple sheet.
        com.apple.developer.applesignin: [Default]
        # FIT-58: invite links open the app (Apple's file is served by the share pages, infra/lambda/sharePages.ts).
        com.apple.developer.associated-domains:
          - applinks:join.barbrabell.com
          - applinks:barbrabell.com
          - applinks:share.barbrabell.com
          - applinks:dev.barbrabell.com
        # FIT-185: run mode records each run as an Apple Health workout with its route.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    # FIT-185: GPS keeps recording a run with the phone locked. The other keys are generated (GENERATE_INFOPLIST_FILE).
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [location]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin
      - package: Amplify
        product: AWSAPIPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxwellkendall.aicoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Barbrabell
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hold the mic to log meals, sleep and weight by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your voice is turned into text on this iPhone to fill in your log.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Run mode maps your run and measures its distance and pace.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Run mode reads your heart rate from Apple Health during a run, when your Watch or AirPods measure it.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Run mode saves each run to Apple Health as a workout, with its route.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        # FIT-57: Release bundles only prod's backend; Debug both, for the You screen's switch.
        # The author's personal history is a dogfooding aid, never shipped.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: history.json goals.json amplify_outputs.dev.json
  AICoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: AICoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # FIT-48: the real on-device model, scored. Slow and nondeterministic, so not in the AICoach scheme's tests.
  AICoachEvals:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Evals]
    dependencies:
      - target: AICoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICoach:
    build:
      targets:
        AICoach: all
        AICoachTests: [test]
    # FIT-83: Pro's products in the simulator and debug runs, before App Store Connect has them.
    run:
      storeKitConfiguration: AICoach.storekit
    test:
      targets: [AICoachTests]
  AICoachEvals:
    build:
      targets:
        AICoach: all
        AICoachEvals: [test]
    test:
      targets: [AICoachEvals]
